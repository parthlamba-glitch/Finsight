services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finsight-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/finsight.db
    volumes:
      - finsight-data:/data
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /svc/api
    container_name: finsight-frontend
    volumes:
      - "/var/www/certbot:/var/www/certbot:ro"
      - "/etc/letsencrypt/live/15.252.70.129:/etc/letsencrypt/live/15.252.70.129:ro"
      - "/etc/letsencrypt/archive/15.252.70.129:/etc/letsencrypt/archive/15.252.70.129:ro"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"

volumes:
  finsight-data:
